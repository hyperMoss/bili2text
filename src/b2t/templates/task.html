{% extends "base.html" %}
{% block content %}
<a class="back" href="/">← {{ t("web_back_home") }}</a>
<section class="card" data-task-id="{{ task_id }}" data-single-task>
  <p class="eyebrow">{{ t("web_task") }} · {{ task_id }}</p>
  <h1>{{ task.source_input }}</h1>
  <p class="muted">{{ task.provider }} · {{ task.model }}</p>
  <p class="task-status" role="status">{{ t("web_" + task.status) }}</p>
  <progress class="task-progress" max="100" value="{{ (task.progress_percent * 100)|round|int }}" aria-label="{{ t('web_progress') }}"></progress>
  <p class="task-message">{{ task.error_message or task.current_message }}</p>
  <details open><summary>{{ t("web_logs") }}</summary><pre id="task-events" class="logs"></pre></details>
</section>
{% endblock %}
